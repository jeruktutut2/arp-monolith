name: 🚀 Build & Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan trigger manual dari UI GitHub

# Cegah concurrent deployment agar tidak saling tumpang tindih
concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ========================================================
  # JOB 1: Test & Build Backend Golang
  # ========================================================
  build-backend:
    name: 🔨 Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: 🧪 Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: 📦 Compile Go Binary (Linux AMD64)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/erp-backend cmd/server/main.go

      - name: 📤 Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/erp-backend
          retention-days: 1

  # ========================================================
  # JOB 2: Build Frontend SvelteKit 2 (Bun)
  # ========================================================
  build-frontend:
    name: 🎨 Build SvelteKit Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            bun install --frozen-lockfile
            bun run build
          else
            echo "Direktori frontend belum dibuat, membuat placeholder dist."
            mkdir -p frontend/build
            echo "Placeholder frontend" > frontend/build/index.js
          fi

      - name: 📤 Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  # ========================================================
  # JOB 3: Deploy Artifacts & Restart Services on VPS
  # ========================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Migrations & Scripts
        uses: actions/checkout@v4

      - name: 📥 Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend-dist

      - name: 📥 Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist

      - name: 🔑 Configure SSH Key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 1. Validasi ketersediaan secret
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY kosong atau belum diisi pada GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Secret VPS_HOST kosong atau belum diisi pada GitHub Repository Secrets!"
            exit 1
          fi

          # 2. Simpan private key dengan line ending UNIX
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 3. Tampilkan validasi fingerprint kunci (tanpa membocorkan isi private key)
          echo "🔍 Memeriksa format SSH Key..."
          ssh-keygen -l -f ~/.ssh/id_ed25519 || echo "⚠️ Warning: format key mungkin tidak standar!"

          # 4. Ambil host key server VPS jika memungkinkan (toleran jika timeout/blocked)
          CLEAN_HOST=$(echo "$VPS_HOST" | sed -E "s|^https?://||; s|/.*$||; s|:[0-9]+$||")
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 5. Buat konfigurasi SSH client secara aman dengan Multiplexing (ControlMaster) & Connection resilience
          printf "Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n  ConnectionAttempts 5\n  ConnectTimeout 15\n  ControlMaster auto\n  ControlPath %s/.ssh/cm-%%C\n  ControlPersist 10m\n  IdentityFile %s/.ssh/id_ed25519\n" "${VPS_PORT:-22}" "$HOME" "$HOME" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: 🚚 Transfer Artifacts to VPS via Rsync
        env:
          PORT: ${{ secrets.VPS_PORT || '22' }}
          USER: ${{ secrets.VPS_USER || 'deployer' }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          KEY_PATH="$HOME/.ssh/id_ed25519"
          CLEAN_HOST=$(echo "$HOST" | sed -E "s|^https?://||; s|/.*$||; s|:[0-9]+$||")

          # Fungsi eksekusi dengan retry otomatis untuk mengantisipasi glitch jaringan
          run_with_retry() {
            local max_attempts=3
            local delay=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "▶️ [Percobaan $attempt/$max_attempts] $*"
              if "$@"; then
                return 0
              fi
              echo "⚠️ Perintah gagal (exit code: $?). Menunggu ${delay} detik sebelum mencoba ulang..."
              sleep $delay
              attempt=$((attempt + 1))
            done
            echo "❌ Gagal setelah $max_attempts percobaan: $*"
            return 1
          }

          echo "=========================================="
          echo "🔍 DIAGNOSTIK KONEKSI SSH KE VPS"
          echo "=========================================="
          echo "Target User : $USER"
          echo "Target Host : $CLEAN_HOST"
          echo "Target Port : $PORT"
          echo "File Kunci  : $KEY_PATH"
          echo "Ukuran File : $(wc -c < "$KEY_PATH") bytes ($(wc -l < "$KEY_PATH") baris)"
          echo "Fingerprint Kunci:"
          ssh-keygen -l -f "$KEY_PATH" || echo "⚠️ Kunci tidak dapat dibaca oleh ssh-keygen!"
          echo "Daftar ~/.ssh:"
          ls -la "$HOME/.ssh/"
          echo "Isi ~/.ssh/config:"
          cat "$HOME/.ssh/config"
          echo "=========================================="

          # 0. Uji dan inisialisasi master SSH connection (ControlMaster multiplexing)
          echo "🔌 Menginisialisasi koneksi SSH Master..."
          ssh "$USER@$CLEAN_HOST" "echo '✅ SSH master connection established successfully to VPS!'"

          SSH_CMD="ssh -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=10m -o ConnectionAttempts=5"

          # 1. Pastikan direktori tujuan tersedia di remote VPS
          echo "📁 Menyiapkan direktori tujuan..."
          $SSH_CMD "$USER@$CLEAN_HOST" "mkdir -p /opt/apps/erp_monolith/backend/bin /opt/apps/erp_monolith/frontend /opt/dev/erp_monolith/backend/migrations"

          # 2. Kirim binary baru backend ke file temporary .new via SCP
          echo "📦 Mengirim binary backend via SCP..."
          run_with_retry scp backend-dist/erp-backend "$USER@$CLEAN_HOST:/opt/apps/erp_monolith/backend/bin/erp-backend.new"
          
          # 3. Kirim migrasi database via Rsync (multiplexed)
          echo "🗄️ Sinkronisasi berkas migrasi database via Rsync..."
          run_with_retry rsync -avz -e "$SSH_CMD" --delete backend/migrations/ "$USER@$CLEAN_HOST:/opt/dev/erp_monolith/backend/migrations/"

          # 4. Kirim folder build frontend via Rsync (multiplexed)
          echo "🎨 Sinkronisasi berkas build frontend via Rsync..."
          run_with_retry rsync -avz -e "$SSH_CMD" --delete frontend-dist/ "$USER@$CLEAN_HOST:/opt/apps/erp_monolith/frontend/"

          # 5. Tutup koneksi SSH master secara rapi
          ssh -O exit "$USER@$CLEAN_HOST" 2>/dev/null || true
          echo "🎉 Seluruh artefak berhasil ditransfer ke VPS!"

      - name: ⚡ Execute Deployment Commands on Remote VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deployer' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "--- [1/5] Menjalankan Migrasi Database ---"
            if command -v migrate >/dev/null 2>&1; then
              migrate -path /opt/dev/erp_monolith/backend/migrations \
                -database "${{ secrets.DIRECT_DATABASE_URL }}" up || echo "Migrasi up selesai."
            fi

            #echo "--- [2/5] Atomic Swap Binary Golang ---"
            #chmod +x /opt/dev/erp_monolith/backend/bin/erp-backend.new
            #mv -f /opt/dev/erp_monolith/backend/bin/erp-backend.new /opt/dev/erp_monolith/backend/bin/erp-backend

            echo "--- [2/5] Atomic Swap Binary Golang di /opt/apps ---"
            chmod +x /opt/apps/erp_monolith/backend/bin/erp-backend.new
            mv -f /opt/apps/erp_monolith/backend/bin/erp-backend.new /opt/apps/erp_monolith/backend/bin/erp-backend
            sudo chown -R erp:erp /opt/apps/erp_monolith/backend/bin/erp-backend

            echo "--- [3/5] Restart Layanan Systemd ---"
            sudo systemctl restart erp-monolith-backend.service
            sudo systemctl restart erp-monolith-frontend.service

            echo "--- [4/5] Verifikasi Health Check ---"
            sleep 3
            curl -fs http://127.0.0.1:8080/health || {
              echo "❌ Backend Health Check GAGAL!"
              sudo systemctl status erp-monolith-backend.service --no-pager
              exit 1
            }

            echo "✅ Health check Backend Berhasil (HTTP 200 OK)."

            echo "--- [5/5] Status Akhir Layanan ---"
            #sudo systemctl is-active erp-backend.service
            sudo systemctl is-active erp-monolith-backend.service
            #sudo systemctl is-active erp-frontend.service
            sudo systemctl is-active erp-monolith-frontend.service
            echo "🎉 Deployment Sukses!"

